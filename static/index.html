<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wallpaper</title>
  <style>
    html, body { margin: 0; background: #111; }
    canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }
  </style>
  <script src="../lib/common.js"></script>
  <script src="../live/runtime.js"></script>
  <script src="aurora.js"></script>
  <script src="dunes.js"></script>
  <script src="bauhaus.js"></script>
  <script src="topography.js"></script>
  <script src="silk.js"></script>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    // Usage: index.html?piece=aurora&w=3840&h=2160[&ascii=150]
    // With ascii=<glyph rows> the picture is drawn small and turned into glyphs by the live ASCII layer.
    function render(piece, w, h, ascii) {
      const canvas = document.getElementById('c');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const wp = WALLPAPERS[piece];
      if (ascii) {
        const A = makeAscii(w, h, ascii);
        // Film grain would read as glyph noise, so skip it for the ASCII version
        const keepGrain = window.grain;
        window.grain = () => {};
        wp.draw(A.ctx, A.src.width, A.src.height, mulberry32(wp.seed));
        window.grain = keepGrain;
        // Dim, fine-lined pieces need their light lifted above the glyph threshold while the
        // background stays black: subtract a black level, then amplify what is left.
        if (wp.asciiGain) {
          const img = A.ctx.getImageData(0, 0, A.src.width, A.src.height);
          const d = img.data, black = wp.asciiBlack || 0;
          for (let i = 0; i < d.length; i += 4) {
            d[i] = (d[i] - black) * wp.asciiGain;
            d[i + 1] = (d[i + 1] - black) * wp.asciiGain;
            d[i + 2] = (d[i + 2] - black) * wp.asciiGain;
          }
          A.ctx.putImageData(img, 0, 0);
        }
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        A.render(ctx);
      } else {
        wp.draw(ctx, w, h, mulberry32(wp.seed));
      }
      return canvas.toDataURL('image/jpeg', 0.93);
    }
    const q = new URLSearchParams(location.search);
    if (q.get('piece')) {
      render(q.get('piece'), +q.get('w') || 3840, +q.get('h') || 2160, +q.get('ascii') || 0);
    }
  </script>
</body>
</html>
