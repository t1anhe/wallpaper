name: Mac app

# Builds Wallpaper.app on a macOS runner and publishes it as the "mac-latest" release.
# Only runs when the app or the bundled wallpapers change.
on:
  push:
    branches: [claude/affectionate-hamilton-in1kmo]
    paths:
      - mac/**
      - live/**
      - lib/**
      - output/static/**
      - .github/workflows/mac-app.yml
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an in-flight build
concurrency:
  group: mac-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Wallpaper.app
        run: VERSION=${{ github.run_number }} bash mac/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Wallpaper
          path: build/Wallpaper.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest build/Wallpaper.zip \
            --target "${{ github.sha }}" \
            --title "Wallpaper for Mac (build ${{ github.run_number }})" \
            --notes "一键安装：在「终端」里运行 curl -fsSL https://raw.githubusercontent.com/t1anhe/wallpaper/claude/affectionate-hamilton-in1kmo/mac/install.sh | bash 。也可以下载 Wallpaper.zip 手动安装（第一次打开需要在 系统设置 → 隐私与安全性 里点「仍要打开」）。装好后会自动更新。壁纸文件夹：~/Wallpaper"
